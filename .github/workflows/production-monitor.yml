name: Roomora production monitor
run-name: ${{ inputs.test_alert && 'Roomora notification test (expected failure)' || 'Roomora production monitor' }}
on:
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Test GitHub failure notifications only (expected failure; no API/database calls)"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: read
  actions: read
concurrency:
  group: production-monitor
  cancel-in-progress: false
jobs:
  monitor:
    # Monitoring is enabled by default. A missing or environment-scoped variable
    # must not silently disable scheduled checks. Only explicit false pauses them.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.ROOMORA_MONITOR_ENABLED != 'false')
    runs-on: ubuntu-latest
    # Health retries have a 120s budget, plus GitHub backup metadata and setup.
    timeout-minutes: 4
    env:
      SITE_URL: https://roomora-blond.vercel.app
      API_ORIGIN: https://roomora-api-qxjb.onrender.com
      CHECK_BACKUP_ARTIFACT: "true"
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Intentional failure to verify GitHub notifications
        if: github.event_name == 'workflow_dispatch' && inputs.test_alert == true
        run: |
          echo "## Notification test - expected failure" >> "$GITHUB_STEP_SUMMARY"
          echo "This failure was requested to verify GitHub Actions notifications. Production health checks were not run and no application or database settings were changed." >> "$GITHUB_STEP_SUMMARY"
          echo "Check the triggering account's configured email inbox and spam folder. A failed test run alone does not confirm email delivery." >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Intentional notification test::Expected failure requested with test_alert=true. Check email delivery, then run normally with test_alert=false."
          exit 1
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: node scripts/check-production.mjs
