name: Roomora database backup
on:
  workflow_dispatch:
  schedule:
    # 02:23 Asia/Bangkok daily (GitHub schedules use UTC).
    - cron: "23 19 * * *"
permissions:
  contents: read
concurrency:
  group: database-backup
  cancel-in-progress: false
jobs:
  backup:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.ROOMORA_BACKUP_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-backup
    env:
      ROOMORA_BACKUP_DATABASE_URL: ${{ secrets.ROOMORA_BACKUP_DATABASE_URL }}
      ROOMORA_BACKUP_KEY: ${{ secrets.ROOMORA_BACKUP_KEY }}
      ROOMORA_POSTGRES_MAJOR: ${{ vars.ROOMORA_POSTGRES_MAJOR || '18' }}
      # The PostgreSQL image does not include the runner's trusted CA bundle.
      ROOMORA_BACKUP_CA_FILE: /etc/ssl/certs/ca-certificates.crt
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Check archive and restore policies
        run: node --experimental-strip-types --test scripts/backup-archive.test.mjs scripts/restore-encrypted-backup.test.mjs
      - name: Validate backup settings without revealing secrets
        run: node scripts/run-database-backup.mjs --check-config
      - name: Export and encrypt without a plaintext dump on disk
        id: export
        run: node scripts/run-database-backup.mjs
      - name: Choose daily or weekly retention
        id: retention
        shell: bash
        run: |
          if [ "$(date -u +%u)" = '7' ]; then
            echo 'days=35' >> "$GITHUB_OUTPUT"
          else
            echo 'days=7' >> "$GITHUB_OUTPUT"
          fi
      # Preserve the recovery file even if the following drill has an infrastructure failure.
      - name: Store encrypted recovery file before the restore drill
        id: archive
        uses: actions/upload-artifact@v7
        with:
          name: database-encrypted-${{ github.run_id }}
          path: |
            backups/encrypted/*.dump.enc
            backups/encrypted/*.dump.enc.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ steps.retention.outputs.days }}
      - name: Restore drill in an isolated PostgreSQL container
        id: restore
        if: github.event_name == 'workflow_dispatch' || steps.retention.outputs.days == '35'
        shell: bash
        run: |
          mapfile -t backups < <(find backups/encrypted -name '*.dump.enc' -type f)
          test "${#backups[@]}" -eq 1
          node --experimental-strip-types scripts/restore-encrypted-backup.mjs "${backups[0]}"
      - name: Record upload and restore outcomes separately
        if: ${{ !cancelled() && steps.export.outcome == 'success' }}
        env:
          ARCHIVE_OUTCOME: ${{ steps.archive.outcome }}
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
        run: |
          echo "Encrypted backup upload: $ARCHIVE_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          echo "Restore drill: $RESTORE_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          if [ "$ARCHIVE_OUTCOME" != "success" ]; then
            echo "Encrypted backup upload did not succeed. No uploaded recovery file is confirmed for this run." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$RESTORE_OUTCOME" = "success" ]; then
            echo "Encrypted backup uploaded and restore drill passed." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$RESTORE_OUTCOME" = "skipped" ]; then
            echo "Encrypted backup uploaded. No restore drill was scheduled for this run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Encrypted backup is retained for recovery investigation. The restore drill did not pass." >> "$GITHUB_STEP_SUMMARY"
          fi
