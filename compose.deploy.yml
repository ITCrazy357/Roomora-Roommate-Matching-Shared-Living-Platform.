name: roomora-${DEPLOY_ENV:?Set DEPLOY_ENV to staging or production}

x-api-environment: &api-environment
  NODE_ENV: production
  PORT: 5000
  FRONTEND_ORIGIN: https://${DOMAIN:?Set DOMAIN}
  AUTH_DEV_EXPOSE_LINKS: "false"
  TRUST_PROXY_HOPS: 1

services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # Private Compose network only. Never publish this port on the server.
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: roomora
      POSTGRES_USER: roomora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roomora -d roomora"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: ${IMAGE_PREFIX:-roomora}-migrate:${RELEASE:-local}
    build:
      context: ./backend
      target: migrate
    env_file: ${ROOMORA_ENV_FILE:-./deploy/roomora.env}
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ${IMAGE_PREFIX:-roomora}-api:${RELEASE:-local}
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    init: true
    env_file: ${ROOMORA_ENV_FILE:-./deploy/roomora.env}
    environment: *api-environment
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/v1/health/ready', {signal: AbortSignal.timeout(4000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  frontend:
    image: ${IMAGE_PREFIX:-roomora}-frontend:${RELEASE:-local}
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: /api/v1
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000', {signal: AbortSignal.timeout(4000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy

volumes:
  redis_data:
  postgres_data:
  caddy_data:
  caddy_config:
